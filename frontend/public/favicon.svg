<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <!-- Growing bars (portfolio chart) -->
  <rect x="4" y="21" width="6" height="8" rx="2" fill="#3b82f6" opacity="0.85"/>
  <rect x="13" y="15" width="6" height="14" rx="2" fill="#3b82f6"/>
  <rect x="22" y="8" width="6" height="21" rx="2" fill="#10b981"/>
  <!-- Upward trend line overlay -->
  <polyline points="7,20 16,14 25,7" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  <!-- Glowing tip dot -->
  <circle cx="25" cy="7" r="3" fill="#10b981" opacity="0.3"/>
  <circle cx="25" cy="7" r="2" fill="#10b981"/>
</svg>
