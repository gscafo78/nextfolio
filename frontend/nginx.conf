user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Cloudflare real IP ──────────────────────────────────────────────────
    # IPv4 ranges — https://www.cloudflare.com/ips-v4
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # cloudflared tunnel daemon stesso host
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # ── Rate limiting ───────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_status 429;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        client_max_body_size 20m;

        # ── Security headers ────────────────────────────────────────────────
        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
        # HSTS omesso: non va inviato su HTTP (i browser lo memorizzano e
        # bloccherebbero il sito se in futuro si torna su HTTP).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google.com; connect-src 'self' wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Static assets (hash-busted da Vite) ────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
            expires 1y;
            add_header Cache-Control            "public, immutable"             always;
            add_header X-Content-Type-Options   "nosniff"                       always;
        }

        # Service Worker: no cache
        location = /sw.js {
            add_header Cache-Control "no-cache" always;
        }

        # ── Auth endpoints — rate limit stretto ─────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://backend:8000;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # ── API REST ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend:8000;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    90s;
        }

        # ── WebSocket ───────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass              http://backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade     $http_upgrade;
            proxy_set_header        Connection  "upgrade";
            proxy_set_header        Host        $host;
            proxy_set_header        X-Real-IP   $remote_addr;
            proxy_read_timeout      3600s;
        }

        # ── SPA fallback ────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
