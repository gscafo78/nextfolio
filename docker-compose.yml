x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nextfolio_postgres
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-nextfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-nextfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextfolio}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Cache / broker ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nextfolio_redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Password obbligatoria in produzione
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextfolio_backend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV:    production
      DEBUG:      "false"
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:        ${SECRET_KEY:?SECRET_KEY required}
      CORS_ORIGINS:      ${CORS_ORIGINS:?CORS_ORIGINS required}
      ALLOWED_HOSTS:     ${ALLOWED_HOSTS:-*}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENFIGI_APY_KEY:  ${OPENFIGI_APY_KEY:-}
      SMTP_HOST:         ${SMTP_HOST:-}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASSWORD:     ${SMTP_PASSWORD:-}
      EMAILS_FROM:       ${EMAILS_FROM:-}
      APP_URL:           ${APP_URL:?APP_URL required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, data]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextfolio_celery
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=warning --concurrency=2
    environment:
      APP_ENV:    production
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:        ${SECRET_KEY}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENFIGI_APY_KEY:  ${OPENFIGI_APY_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextfolio_celery_beat
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # --schedule in /tmp per evitare scritture in /app con utente non-root
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=warning --schedule /tmp/celerybeat-schedule
    environment:
      APP_ENV:    production
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-nextfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextfolio}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:        ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Frontend (nginx) ────────────────────────────────────────────────────────
  # Esposto su 127.0.0.1:3000 — il tunnel Cloudflare sulla VPS punta a questo
  # indirizzo. Configurare nel dashboard: nextfolio.myhomecloud.it → http://127.0.0.1:3000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextfolio_frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  backend:  # frontend ↔ backend
  data:     # backend, celery ↔ postgres, redis

volumes:
  postgres_data:
  redis_data:
