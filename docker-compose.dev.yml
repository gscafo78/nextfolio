services:
  postgres:
    image: postgres:15-alpine
    container_name: nextfolio_postgres
    environment:
      POSTGRES_USER: nextfolio
      POSTGRES_PASSWORD: nextfolio
      POSTGRES_DB: nextfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nextfolio_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nextfolio_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nextfolio:nextfolio@postgres:5432/nextfolio
      DATABASE_URL_SYNC: postgresql://nextfolio:nextfolio@postgres:5432/nextfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nextfolio_celery
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://nextfolio:nextfolio@postgres:5432/nextfolio
      DATABASE_URL_SYNC: postgresql://nextfolio:nextfolio@postgres:5432/nextfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nextfolio_celery_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://nextfolio:nextfolio@postgres:5432/nextfolio
      DATABASE_URL_SYNC: postgresql://nextfolio:nextfolio@postgres:5432/nextfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nextfolio_frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_BACKEND_HOST: backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
